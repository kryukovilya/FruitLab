name: Publish FruitLab distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - scripts/prepare_release.py
      - distribution/**

permissions:
  contents: write

concurrency:
  group: fruitlab-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install packaging dependencies
        if: steps.release.outputs.exists != 'true'
        run: python -m pip install -r distribution/requirements.txt
      - name: Prepare and verify Windows build and editable project
        if: steps.release.outputs.exists != 'true'
        run: python scripts/prepare_release.py --output dist-release
      - name: Publish verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release.outputs.exists }}" = "true" ]; then
            gh release edit v1.0.0 --notes-file distribution/release-notes.md
          else
            gh release create v1.0.0 \
              --target "$(git rev-parse HEAD)" \
              --title "FruitLab — игра и проект Varwin" \
              --notes-file distribution/release-notes.md \
              dist-release/FruitLab.exe dist-release/FruitLab.vwp
          fi
      - name: Download and verify published EXE and Varwin project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verified-release
          gh release download v1.0.0 --pattern FruitLab.exe --pattern FruitLab.vwp --dir verified-release
          gh api repos/${{ github.repository }}/releases/tags/v1.0.0 > verified-release/release.json
          python - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          import zipfile

          root = Path("verified-release")
          release = json.loads((root / "release.json").read_text())
          assets = {asset["name"]: asset for asset in release["assets"]}
          for name in ("FruitLab.exe", "FruitLab.vwp"):
              path = root / name
              asset = assets[name]
              if path.stat().st_size != asset["size"]:
                  raise ValueError(f"{name}: incomplete download")
              with path.open("rb") as stream:
                  actual = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
              if not asset.get("digest") or actual != asset["digest"]:
                  raise ValueError(f"{name}: SHA-256 mismatch")
              if name.endswith(".exe"):
                  with path.open("rb") as stream:
                      if stream.read(2) != b"MZ":
                          raise ValueError("The Windows executable header is missing")
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      raise ValueError(f"{name}: corrupt archive")
                  names = {entry.replace("\\", "/") for entry in archive.namelist()}
                  required = "project/index.json" if name.endswith(".exe") else "FruitLab.vwm"
                  if required not in names:
                      raise ValueError(f"{name}: missing project metadata")
                  if name.endswith(".vwp"):
                      for entry in archive.namelist():
                          if entry.lower().endswith((".vwo", ".vws")):
                              with zipfile.ZipFile(io.BytesIO(archive.read(entry))) as nested:
                                  if nested.testzip() is not None:
                                      raise ValueError(f"{entry}: corrupt nested archive")
              print(f"Verified {name}: {actual}")
          PY
