name: Publish FruitLab distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]

permissions:
  contents: write

concurrency:
  group: fruitlab-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Complete FruitLab publication')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Install packaging dependencies
        run: python -m pip install -r distribution/requirements.txt
      - name: Prepare and verify Windows build and editable project
        run: python scripts/prepare_release.py --output dist-release
      - name: Remove contact emails from commit metadata
        run: |
          python scripts/normalize_history.py --rewrite
          git push --force-with-lease=refs/heads/main:${{ github.sha }} origin HEAD:main
      - name: Publish verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --target "$(git rev-parse HEAD)" \
            --title "FruitLab — игра и проект Varwin" \
            --notes-file distribution/release-notes.md \
            dist-release/FruitLab.exe dist-release/FruitLab.vwp \
            dist-release/SHA256SUMS.txt dist-release/verification.json
